name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read              # el flujo no escribe nada ni usa secretos: los tests son sintéticos

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Escáner de secretos
        run: python herramientas/comprobar_secretos.py
      - name: Tests
        run: python -m pytest -q
